[package]
name = "librustdash"
version = "0.1.0"
edition = "2021"

[features]
x11 = ["dep:x11_hash"]

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
byteorder = "1.5"
thiserror = "1.0"
sha2 = "0.10"
x11_hash = { path = "../../../x11-hash/rust", optional = true }

[dev-dependencies]
proptest = "1.5"
serde_json = "1.0"
x11_hash = { path = "../../../x11-hash/rust" }
