[workspace]
members = [
    "crates/daino-core",
    "crates/daino-serve",
    "crates/daino-state",
    "dainod",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
librustdash = { path = "../librustdash", features = ["x11"] }
daino-core = { path = "crates/daino-core" }
daino-serve = { path = "crates/daino-serve" }
daino-state = { path = "crates/daino-state" }
anyhow = "1.0"
byteorder = "1.5"
hex = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
